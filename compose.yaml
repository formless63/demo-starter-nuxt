x-application-image: &application-image
  image: ${APP_IMAGE:-nuxt-starter:local}
  build:
    context: .

x-database-environment: &database-environment
  DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-nuxt_starter}
  PGBOSS_SCHEMA: ${PGBOSS_SCHEMA:-pgboss}

x-observability-environment: &observability-environment
  LOG_LEVEL: ${LOG_LEVEL:-info}
  OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-}
  OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-otlp}
  OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-otlp}
  OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
  APP_VERSION: ${APP_VERSION:-unknown}
  APP_REVISION: ${APP_REVISION:-unknown}
  DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-production}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nuxt_starter}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  migrate:
    <<: *application-image
    profiles: ["tools"]
    command: ["sh", "-c", "node .migration/migrate.mjs && node .jobs/migrate.mjs && node .jobs/doctor.mjs"]
    environment: *database-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    <<: *application-image
    environment:
      <<: [*database-environment, *observability-environment]
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-nuxt-starter}
      NODE_ENV: production
      IMPORT_EXPORT_MAX_BYTES: ${IMPORT_EXPORT_MAX_BYTES:-16777216}
      IMPORT_EXPORT_MAX_ROWS: ${IMPORT_EXPORT_MAX_ROWS:-10000}
      IMPORT_EXPORT_TIMEOUT_SECONDS: ${IMPORT_EXPORT_TIMEOUT_SECONDS:-60}
      IMPORT_EXPORT_ARTIFACT_TTL_SECONDS: ${IMPORT_EXPORT_ARTIFACT_TTL_SECONDS:-86400}
      PGBOSS_USE_LISTEN_NOTIFY: ${PGBOSS_USE_LISTEN_NOTIFY:-false}
      NUXT_AUTH_SECRET: ${NUXT_AUTH_SECRET:-}
      NUXT_PUBLIC_APP_BASE_URL: ${NUXT_PUBLIC_APP_BASE_URL:-}
      NUXT_GITHUB_CLIENT_ID: ${NUXT_GITHUB_CLIENT_ID:-}
      NUXT_GITHUB_CLIENT_SECRET: ${NUXT_GITHUB_CLIENT_SECRET:-}
      NUXT_OIDC_ISSUER: ${NUXT_OIDC_ISSUER:-}
      NUXT_OIDC_CLIENT_ID: ${NUXT_OIDC_CLIENT_ID:-}
      NUXT_OIDC_CLIENT_SECRET: ${NUXT_OIDC_CLIENT_SECRET:-}
      # Optional Email, server-only; no SMTP connection until used.
      NUXT_MAGIC_LINK_ENABLED: ${NUXT_MAGIC_LINK_ENABLED:-false}
      NUXT_PUBLIC_MAGIC_LINK_ENABLED: ${NUXT_PUBLIC_MAGIC_LINK_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-}
      EMAIL_REPLY_TO_ADDRESS: ${EMAIL_REPLY_TO_ADDRESS:-}
      EMAIL_REPLY_TO_NAME: ${EMAIL_REPLY_TO_NAME:-}
      EMAIL_MAX_RECIPIENTS: ${EMAIL_MAX_RECIPIENTS:-50}
      # Optional storage configuration only; no provider is started or required.
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_REGION: ${STORAGE_REGION:-}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-}
      STORAGE_SESSION_TOKEN: ${STORAGE_SESSION_TOKEN:-}
      STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-}
      STORAGE_PRESIGN_TTL_SECONDS: ${STORAGE_PRESIGN_TTL_SECONDS:-600}
      STORAGE_KEY_PREFIX: ${STORAGE_KEY_PREFIX:-}
      # Optional AI; no provider connection at startup.
      AI_PROVIDER: ${AI_PROVIDER:-openai-compatible}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-60}
      # Optional Cache configuration; no startup connection or bundled backend.
      CACHE_URL: ${CACHE_URL:-}
      CACHE_KEY_PREFIX: ${CACHE_KEY_PREFIX:-app}
      CACHE_DEFAULT_TTL_SECONDS: ${CACHE_DEFAULT_TTL_SECONDS:-300}
      CACHE_MAX_VALUE_BYTES: ${CACHE_MAX_VALUE_BYTES:-1048576}
      REALTIME_TRANSPORTS: ${REALTIME_TRANSPORTS:-sse}
      NTFY_BASE_URL: ${NTFY_BASE_URL:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      NTFY_TIMEOUT_SECONDS: ${NTFY_TIMEOUT_SECONDS:-10}
    ports: ["${APP_PORT:-3000}:3000"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  worker:
    <<: *application-image
    command: ["node", ".jobs/worker.mjs"]
    environment:
      <<: [*database-environment, *observability-environment]
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-nuxt-starter-worker}
      NODE_ENV: production
      IMPORT_EXPORT_MAX_BYTES: ${IMPORT_EXPORT_MAX_BYTES:-16777216}
      IMPORT_EXPORT_MAX_ROWS: ${IMPORT_EXPORT_MAX_ROWS:-10000}
      IMPORT_EXPORT_TIMEOUT_SECONDS: ${IMPORT_EXPORT_TIMEOUT_SECONDS:-60}
      IMPORT_EXPORT_ARTIFACT_TTL_SECONDS: ${IMPORT_EXPORT_ARTIFACT_TTL_SECONDS:-86400}
      JOBS_CONCURRENCY: ${JOBS_CONCURRENCY:-4}
      # Optional storage configuration only; no provider is started or required.
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_REGION: ${STORAGE_REGION:-}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-}
      STORAGE_SESSION_TOKEN: ${STORAGE_SESSION_TOKEN:-}
      STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-}
      STORAGE_PRESIGN_TTL_SECONDS: ${STORAGE_PRESIGN_TTL_SECONDS:-600}
      STORAGE_KEY_PREFIX: ${STORAGE_KEY_PREFIX:-}
      # Optional current-target notification delivery. No transport contacts on boot.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-}
      EMAIL_REPLY_TO_ADDRESS: ${EMAIL_REPLY_TO_ADDRESS:-}
      EMAIL_REPLY_TO_NAME: ${EMAIL_REPLY_TO_NAME:-}
      EMAIL_MAX_RECIPIENTS: ${EMAIL_MAX_RECIPIENTS:-50}
      NTFY_BASE_URL: ${NTFY_BASE_URL:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      NTFY_TIMEOUT_SECONDS: ${NTFY_TIMEOUT_SECONDS:-10}
      PGBOSS_USE_LISTEN_NOTIFY: ${PGBOSS_USE_LISTEN_NOTIFY:-false}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes: { postgres-data: {} }
