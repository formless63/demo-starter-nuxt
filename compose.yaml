x-application-image: &application-image
  image: ${APP_IMAGE:-nuxt-starter:local}
  build:
    context: .

x-database-environment: &database-environment
  DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-nuxt_starter}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nuxt_starter}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  migrate:
    <<: *application-image
    profiles: ["tools"]
    command: ["node", ".migration/migrate.mjs"]
    environment: *database-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    <<: *application-image
    environment:
      <<: *database-environment
      NODE_ENV: production
      NUXT_AUTH_SECRET: ${NUXT_AUTH_SECRET:-}
      NUXT_PUBLIC_APP_BASE_URL: ${NUXT_PUBLIC_APP_BASE_URL:-}
      NUXT_GITHUB_CLIENT_ID: ${NUXT_GITHUB_CLIENT_ID:-}
      NUXT_GITHUB_CLIENT_SECRET: ${NUXT_GITHUB_CLIENT_SECRET:-}
      NUXT_OIDC_ISSUER: ${NUXT_OIDC_ISSUER:-}
      NUXT_OIDC_CLIENT_ID: ${NUXT_OIDC_CLIENT_ID:-}
      NUXT_OIDC_CLIENT_SECRET: ${NUXT_OIDC_CLIENT_SECRET:-}
    ports: ["${APP_PORT:-3000}:3000"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes: { postgres-data: {} }
