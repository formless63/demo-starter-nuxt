name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.packages.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.2 }
      - id: packages
        run: echo "matrix=$(bun run packages:matrix)" >> "$GITHUB_OUTPUT"

  package-test:
    needs: package-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.package-matrix.outputs.matrix) }}
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_DB: nuxt_starter, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/nuxt_starter
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.2 }
      - name: Verify lifecycle runtimes
        run: |
          node -e "console.log('Node', process.version); if (Number(process.versions.node.split('.')[0]) !== 24) process.exit(1)"
          bun --version
      - run: bun install --frozen-lockfile
      - run: bun run packages:test ${{ matrix.capability }}

  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_DB: nuxt_starter, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/nuxt_starter
      NUXT_AUTH_SECRET: ci-secret-that-is-at-least-thirty-two-characters
      NUXT_PUBLIC_APP_BASE_URL: http://127.0.0.1:3001
      APP_IMAGE: nuxt-starter:ci
      COMPOSE_PROJECT_NAME: nuxt-ci
      APP_PORT: 3001
      POSTGRES_PORT: 5433
      REALTIME_TRANSPORTS: sse,websocket
      OPS_ADMIN_USER_IDS: ops-e2e-operator
      APP_VERSION: ci
      APP_REVISION: ${{ github.sha }}
      DEPLOYMENT_ENVIRONMENT: ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.2 }
      - name: Verify application runtimes
        run: |
          node -e "console.log('Node', process.version); if (Number(process.versions.node.split('.')[0]) !== 24) process.exit(1)"
          bun --version
      - run: bun install --frozen-lockfile
      - run: bun run capabilities:check
      - run: bun run agents:check
      - run: bun run agents:test
      - run: bun run db:migrate
      - run: bun run jobs:migrate
      - run: bun run jobs:doctor
      - run: bun run jobs:smoke
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run test:notification-email
      - run: bunx playwright install --with-deps chromium
      - name: Verify scoped transport diagnostics
        run: node --test tests/diagnostics/search-transport.test.cjs
      - name: Verify development HTTP and browser contracts
        env:
          NUXT_E2E_SEARCH_TRANSPORT_DIAGNOSTICS: 'true'
          NODE_OPTIONS: --require=./tests/e2e/fixtures/search-transport-diagnostics.cjs
        run: bun run test:e2e
      - run: bun run build
      - run: bun run test:file-ui-reference
      - run: bun run packages:test ops-admin
      - run: bun run test:ops-reference
      - name: Build production application image
        run: docker compose build app
      - name: Start container smoke database
        run: docker compose up -d postgres
      - name: Apply migrations through production image
        run: docker compose run --rm migrate
      - name: Start and await production application
        run: docker compose up -d --wait app worker
      - name: Verify production health endpoint
        run: curl --fail --show-error --silent http://127.0.0.1:3001/api/health
      - name: Verify authenticated production HTTP and browser contracts
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3001
          DATABASE_URL: postgres://postgres:postgres@localhost:5433/nuxt_starter
          DISPOSABLE_DATABASE_TESTS: 'true'
          PRODUCTION_COMPOSE_PROJECT: nuxt-ci
        run: bun run test:e2e
      - name: Verify production SMTP composition
        run: bun run test:notification-email
      - name: Verify production worker is running
        run: docker compose ps --status running worker | grep worker
      - name: Verify instrumented production job execution
        run: docker compose exec -T worker node .jobs/smoke.mjs
      - name: Verify pull-only preview and local magic-link login
        env:
          PREVIEW_IMAGE: nuxt-starter:ci
        run: node scripts/preview-smoke.mjs
      - name: Stop container smoke stack
        if: always()
        run: docker compose down --volumes --remove-orphans

      # This job uses only disposable local services and synthetic accounts.
      # Never broaden these paths or enable trace upload against live accounts.
      - name: Preserve failed browser request traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/**/trace.zip
            test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 3

  publish-preview:
    name: Publish GHCR preview
    needs: [check, package-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Derive lowercase image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=demo-starter-nuxt full reference preview
          cache-from: type=gha,scope=preview
          cache-to: type=gha,mode=max,scope=preview
