services:
  valkey:
    command:
      - valkey-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --tls-port
      - "6380"
      - --tls-cert-file
      - /certs/server.crt
      - --tls-key-file
      - /certs/server.key
      - --tls-ca-cert-file
      - /certs/ca.crt
      - --tls-auth-clients
      - "no"
    ports:
      - "127.0.0.1:0:6380"
    volumes:
      - "${CACHE_TEST_CERT_DIR:?temporary test certificates required}:/certs:ro"
